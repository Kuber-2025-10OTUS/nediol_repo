replicaCount: 3

namespace: homework

app:
  name: homework
  fullname: homework
  labels:
    app: homework

image:
  repository: python
  tag: 3.11-alpine
  pullPolicy: IfNotPresent

initImage:
  repository: curlimages/curl
  tag: 8.17.0

serviceAccount:
  monitoring:
    name: monitoring
  cd:
    name: cd

rbac:
  enabled: true
  cdAdmin: true

service:
  name: homework-service
  type: ClusterIP
  port: 8000

ingressHomepage:
  name: ingress-homepage
  enabled: true
  className: nginx
  host: homework.otus
  paths:
    index: /homepage

ingressMetrics:
  name: ingress-metrics
  enabled: true
  className: nginx
  host: homework.otus
  paths:
    metrics: /metrics

probes:
  enabled: true
  readiness:
    path: /index.html
    initialDelaySeconds: 5
    periodSeconds: 5

nodeSelector:
  homework: "true"

persistence:
  enabled: true
  storageClass: minikube-hostpath
  size: 100Mi

config:
  key1: a
  key2: b
  key3: c

secret:
  monitoringToken: 

redis:
  auth:
    enabled: false