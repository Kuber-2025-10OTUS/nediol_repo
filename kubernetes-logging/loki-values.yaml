deploymentMode: SingleBinary

loki:
  auth_enabled: false

  commonConfig:
    replication_factor: 1

  storage:
    type: s3

    bucketNames:
      chunks: k8s-platform-otus-s3
      ruler: k8s-platform-otus-s3
      admin: k8s-platform-otus-s3

    s3:
      endpoint: "https://storage.yandexcloud.net"
      access_key_id:
      secret_access_key:
      insecure: false

  schemaConfig:
    configs:
      - from: "2025-01-01"
        store: tsdb
        index:
          prefix: loki_index_
          period: 24h
        object_store: s3
        schema: v13

nodeSelector:
  node-role: "infra"

tolerations:
  - key: "node-role"
    operator: "Equal"
    value: "infra"
    effect: "NoSchedule"

chunksCache:
  enabled: false
  allocatedMemory: 1024

singleBinary:
  replicas: 1

read:
  replicas: 0
backend:
  replicas: 0
write:
  replicas: 0

ingester:
  replicas: 0
querier:
  replicas: 0
queryFrontend:
  replicas: 0
queryScheduler:
  replicas: 0
distributor:
  replicas: 0
compactor:
  replicas: 0
indexGateway:
  replicas: 0
bloomCompactor:
  replicas: 0
bloomGateway:
  replicas: 0