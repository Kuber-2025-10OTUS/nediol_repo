apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kubernetes-templating
  namespace: argocd
spec:
  project: otus
  source:
    repoURL: "https://github.com/Kuber-2025-10OTUS/nediol_repo.git"
    targetRevision: HEAD
    path: "kubernetes-templating"
    helm:
      parameters:
        - name: replicaCount
          value: "3"
  destination:
    server: "https://kubernetes.default.svc"
    namespace: homeworkhelm
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true