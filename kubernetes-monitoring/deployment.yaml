apiVersion: apps/v1
kind: Deployment
metadata:
  name: web-server-deployment
  labels:
    myapp: web-server
spec:
  replicas: 1
  selector:
    matchLabels:
      myapp: web-server
  template:
    metadata:
      labels:
        myapp: web-server
    spec:
      containers:
        - name: web-server
          imagePullPolicy: Never
          image: docker.io/library/nginx-custom-metrics:latest
          ports:
            - containerPort: 80
        - name: nginx-exporter
          image: nginx/nginx-prometheus-exporter:1.5.1
          args:
            - '--nginx.scrape-uri=http://localhost:80/metrics'
          ports:
            - containerPort: 9113